<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 455 112" fill="none" role="img" aria-label="OshiCart">
  <defs>
    <linearGradient id="badgeGradientLight" x1="14" y1="12" x2="96" y2="94" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="0.45" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="badgeGlossLight" x1="27" y1="20" x2="72" y2="72" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.65"/>
      <stop offset="0.62" stop-color="white" stop-opacity="0.12"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cartGradientLight" x1="363" y1="31" x2="430" y2="91" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#93C5FD"/>
    </linearGradient>
    <filter id="logoDepthLight" x="-2" y="0" width="458" height="112" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1" stdDeviation="0" flood-color="#FFFFFF" flood-opacity="0.2"/>
      <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <filter id="badgeDepthLight" x="0" y="2" width="110" height="110" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.28"/>
      <feDropShadow dx="-2" dy="-2" stdDeviation="1" flood-color="#FFFFFF" flood-opacity="0.24"/>
    </filter>
    <filter id="textDepthLight" x="110" y="23" width="238" height="70" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="-1" stdDeviation="0" flood-color="#FFFFFF" flood-opacity="0.25"/>
      <feDropShadow dx="2" dy="4" stdDeviation="1.4" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <filter id="cartDepthLight" x="350" y="21" width="92" height="85" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="-1" stdDeviation="0" flood-color="#FFFFFF" flood-opacity="0.2"/>
      <feDropShadow dx="3" dy="5" stdDeviation="2" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <g filter="url(#logoDepthLight)">
    <g filter="url(#badgeDepthLight)">
      <rect x="16" y="14" width="78" height="78" rx="25" fill="url(#badgeGradientLight)"/>
      <path d="M21 24c10-8 32-11 55 0 10 5 14 13 13 22C79 34 58 25 21 24Z" fill="url(#badgeGlossLight)"/>
      <path d="M36 39h8l5.4 27h29l6.2-19.2H53.5" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="m59 35 8.2 8.2L82 27" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="54" cy="75" r="4.8" fill="white"/>
      <circle cx="75" cy="75" r="4.8" fill="white"/>
    </g>

    <text x="116" y="73" filter="url(#textDepthLight)" font-family="Arial Rounded MT Bold, Nunito, Inter, Segoe UI, Arial, sans-serif" font-size="57" font-weight="900" letter-spacing="-1">
      <tspan fill="#F8FAFC">Oshi</tspan><tspan fill="#34D777">Cart</tspan>
    </text>

    <path d="M119 84h140" stroke="#60A5FA" stroke-width="5" stroke-linecap="round"/>
    <path d="M268 84h68" stroke="#34D777" stroke-width="5" stroke-linecap="round"/>

    <g filter="url(#cartDepthLight)">
      <g stroke="url(#cartGradientLight)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M366 35h15l8 38h43l7-26h-46"/>
        <path d="M395 59h34"/>
        <path d="M391 73h39"/>
      </g>
      <circle cx="401" cy="89" r="6" fill="#60A5FA"/>
      <circle cx="430" cy="89" r="6" fill="#60A5FA"/>
      <path d="M394 39h40" stroke="white" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
