          - heading "10. Selling online or digital services" [level=2] [ref=f1e277]
          - paragraph [ref=f1e278]: Design, marketing, consulting, lessons — work with nothing to deliver and nobody to visit.
          - list [ref=f1e279]:
            - listitem [ref=f1e280]:
              - generic [ref=f1e281]: "1"
              - generic [ref=f1e282]:
