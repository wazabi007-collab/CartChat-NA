            - strong [ref=f1e247]: Settings
            - text: — untick "Use the simple order flow".
          - paragraph [ref=f1e248]: Not paid? OshiCart sends two reminders, at 6 hours and the next morning, then cancels the order after about two days and puts the stock back. The moment you record a payment — or the customer uploads proof — the reminders stop.
