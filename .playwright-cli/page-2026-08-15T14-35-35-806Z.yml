        - generic [ref=f1e66]:
          - heading "1. Welcome" [level=2] [ref=f1e68]
          - paragraph [ref=f1e69]: OshiCart is a Namibian platform for selling online. You get a store link customers can open on their phone, orders arrive on WhatsApp, and customers pay you directly — OshiCart takes no commission on your sales.
          - paragraph [ref=f1e70]:
            - text: You do not need a website, a domain, or a card machine. Your store link
            - emphasis [ref=f1e71]: is
            - text: your website.
        - generic [ref=f1e72]:
          - heading "2. Create your store" [level=2] [ref=f1e74]
          - paragraph [ref=f1e75]: The setup wizard takes about two minutes.
          - list [ref=f1e76]:
            - listitem [ref=f1e77]:
              - generic [ref=f1e78]: "1"
              - generic [ref=f1e79]: Sign up, then open the setup wizard. It starts automatically the first time.
            - listitem [ref=f1e80]:
              - generic [ref=f1e81]: "2"
              - generic [ref=f1e82]:
                - text: Enter your
                - strong [ref=f1e83]: store name
                - text: — this is what customers see, so use your real trading name.
            - listitem [ref=f1e84]:
              - generic [ref=f1e85]: "3"
              - generic [ref=f1e86]:
                - text: Enter your
                - strong [ref=f1e87]: WhatsApp number
                - text: . Orders and alerts come to this number, so use the phone you actually carry.
            - listitem [ref=f1e88]:
              - generic [ref=f1e89]: "4"
              - generic [ref=f1e90]:
                - text: Pick your
                - strong [ref=f1e91]: region and town
                - text: . Customers filter by town when browsing, so this decides who finds you.
            - listitem [ref=f1e92]:
              - generic [ref=f1e93]: "5"
              - generic [ref=f1e94]:
                - text: Choose your
                - strong [ref=f1e95]: industry
                - text: . It sets your store's layout and category icons — a bakery looks different from a hardware shop.
            - listitem [ref=f1e96]:
              - generic [ref=f1e97]: "6"
              - generic [ref=f1e98]: Save. Your store link is created immediately.
        - generic [ref=f1e99]:
          - heading "3. Add your first product" [level=2] [ref=f1e101]
          - paragraph [ref=f1e102]: This is the step most new stores skip — and it is the one that decides whether anyone ever finds you.
          - list [ref=f1e103]:
            - listitem [ref=f1e104]:
              - generic [ref=f1e105]: "1"
              - generic [ref=f1e106]:
                - text: Go to
                - strong [ref=f1e107]: Products → Add product
                - text: .
            - listitem [ref=f1e108]:
              - generic [ref=f1e109]: "2"
              - generic [ref=f1e110]: Give it a clear name and a price. Prices are in Namibian dollars.
            - listitem [ref=f1e111]:
              - generic [ref=f1e112]: "3"
              - generic [ref=f1e113]: Add a photo. Natural daylight, plain background, product filling the frame. Photos sell more than words do.
            - listitem [ref=f1e114]:
              - generic [ref=f1e115]: "4"
              - generic [ref=f1e116]:
                - text: If it comes in sizes or colours, add
                - strong [ref=f1e117]: variants
                - text: so customers choose at checkout instead of messaging you.
            - listitem [ref=f1e118]:
              - generic [ref=f1e119]: "5"
              - generic [ref=f1e120]:
                - text: Turn on
                - strong [ref=f1e121]: stock tracking
                - text: if you want the store to stop selling when you run out.
            - listitem [ref=f1e122]:
              - generic [ref=f1e123]: "6"
              - generic [ref=f1e124]: Save, then open your store link and check it looks right.
          - paragraph [ref=f1e125]:
            - strong [ref=f1e126]: Your store will not appear in Browse Stores until it has at least one product.
            - text: An empty shop is hidden on purpose — sending customers to a store with nothing to buy loses them for good.
        - generic [ref=f1e127]:
          - heading "4. Payment methods" [level=2] [ref=f1e129]
          - paragraph [ref=f1e130]: Customers pay you directly. Choose the methods you actually use.
          - list [ref=f1e131]:
            - listitem [ref=f1e132]:
              - generic [ref=f1e133]: "1"
              - generic [ref=f1e134]:
                - text: Go to
                - strong [ref=f1e135]: Settings → Payments
                - text: .
            - listitem [ref=f1e136]:
              - generic [ref=f1e137]: "2"
              - generic [ref=f1e138]: "Tick the methods you accept: bank transfer (EFT), cash on delivery or collection, MTC Maris, eWallet, FNB Pay2Cell, or PayToday."
            - listitem [ref=f1e139]:
              - generic [ref=f1e140]: "3"
              - generic [ref=f1e141]:
                - strong [ref=f1e142]: Enter the account or number for every method you tick.
