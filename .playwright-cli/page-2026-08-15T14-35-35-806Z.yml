            - listitem [ref=f1e144]:
              - generic [ref=f1e145]: "4"
              - generic [ref=f1e146]: Save.
          - paragraph [ref=f1e147]: A method with no details cannot be paid, so OshiCart hides it at checkout and will not let you save it. If none of your methods are complete, your checkout closes and buyers are told to message you instead — better than taking an order nobody can pay.
