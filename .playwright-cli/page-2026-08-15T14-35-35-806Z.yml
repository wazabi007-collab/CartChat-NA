          - paragraph [ref=f1e295]: A store can mix them freely. A salon can sell in-chair haircuts, call-outs to a client's home, and online consultations side by side — each item carries its own setting.
        - generic [ref=f1e296]:
          - heading "11. Hiring things out (rentals)" [level=2] [ref=f1e298]
          - paragraph [ref=f1e299]: Tents, tools, sound gear, dresses — anything customers borrow and bring back.
          - list [ref=f1e300]:
