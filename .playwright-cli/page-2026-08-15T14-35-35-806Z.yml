                - text: ", choose"
                - strong [ref=f1e284]: Online
                - text: .
            - listitem [ref=f1e285]:
              - generic [ref=f1e286]: "2"
              - generic [ref=f1e287]: "Checkout then changes for that customer: no delivery, no collection, no courier, and no address. They only give their name and WhatsApp number."
            - listitem [ref=f1e288]:
              - generic [ref=f1e289]: "3"
              - generic [ref=f1e290]:
                - text: If you work by appointment — a coaching call, a lesson — set your times under
